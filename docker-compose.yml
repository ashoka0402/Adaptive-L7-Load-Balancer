services:
  load-balancer:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:${PULSE_PORT:-8080}:8080"
    volumes:
      - ./config:/app/config:ro
      - pulse-data:/app/data
    depends_on:
      - backend-1
      - backend-2
      - backend-3
    environment:
      - PYTHONUNBUFFERED=1
      - PULSE_SAMPLE_CLUSTER=1
      - PULSE_BENCHMARK_TOKEN=${PULSE_BENCHMARK_TOKEN:-pulse-compose-local-workload}
    command: ["python", "-m", "app.main", "--config", "config/live.docker.json", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/pulse/"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  backend-1:
    build:
      context: .
      dockerfile: backends/Dockerfile
    environment:
      PULSE_BENCHMARK_TOKEN: ${PULSE_BENCHMARK_TOKEN:-pulse-compose-local-workload}
    command: ["python", "-m", "backends.workload", "--host", "0.0.0.0", "--port", "8001", "--id", "backend-1"]
    expose:
      - "8001"
    restart: unless-stopped

  backend-2:
    build:
      context: .
      dockerfile: backends/Dockerfile
    environment:
      PULSE_BENCHMARK_TOKEN: ${PULSE_BENCHMARK_TOKEN:-pulse-compose-local-workload}
    command: ["python", "-m", "backends.workload", "--host", "0.0.0.0", "--port", "8002", "--id", "backend-2"]
    expose:
      - "8002"
    restart: unless-stopped

  backend-3:
    build:
      context: .
      dockerfile: backends/Dockerfile
    environment:
      PULSE_BENCHMARK_TOKEN: ${PULSE_BENCHMARK_TOKEN:-pulse-compose-local-workload}
    command: ["python", "-m", "backends.workload", "--host", "0.0.0.0", "--port", "8003", "--id", "backend-3"]
    expose:
      - "8003"
    restart: unless-stopped

  backend-4:
    build:
      context: .
      dockerfile: backends/Dockerfile
    environment:
      PULSE_BENCHMARK_TOKEN: ${PULSE_BENCHMARK_TOKEN:-pulse-compose-local-workload}
    command: ["python", "-m", "backends.workload", "--host", "0.0.0.0", "--port", "8004", "--id", "backend-4"]
    expose:
      - "8004"
    restart: unless-stopped

  backend-5:
    build:
      context: .
      dockerfile: backends/Dockerfile
    environment:
      PULSE_BENCHMARK_TOKEN: ${PULSE_BENCHMARK_TOKEN:-pulse-compose-local-workload}
    command: ["python", "-m", "backends.workload", "--host", "0.0.0.0", "--port", "8005", "--id", "backend-5"]
    expose:
      - "8005"
    restart: unless-stopped

  backend-6:
    build:
      context: .
      dockerfile: backends/Dockerfile
    environment:
      PULSE_BENCHMARK_TOKEN: ${PULSE_BENCHMARK_TOKEN:-pulse-compose-local-workload}
    command: ["python", "-m", "backends.workload", "--host", "0.0.0.0", "--port", "8006", "--id", "backend-6"]
    expose:
      - "8006"
    restart: unless-stopped

  traffic-center:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      PULSE_TRAFFIC_TARGET: http://load-balancer:8080
      PULSE_BENCHMARK_TOKEN: ${PULSE_BENCHMARK_TOKEN:-pulse-compose-local-workload}
    command: ["uvicorn", "app.fastapi_lb.traffic:app", "--host", "0.0.0.0", "--port", "8081", "--no-access-log"]
    depends_on:
      - load-balancer
      - backend-4
      - backend-5
      - backend-6
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.48.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      - load-balancer
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.2.2
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-local-grafana-change-me}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  pulse-data:
