name: Pulse verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]' pytest-cov
      - run: python -m compileall -q app backends benchmarks
      - name: Run full suite (no retries or ignored failures)
        run: python -m pytest -ra --strict-markers --junitxml=reports/junit.xml --cov=app --cov-report=term-missing --cov-report=xml:reports/coverage.xml
      - name: Generate actual Arena smoke benchmark
        run: python -m benchmarks.run_arena --output reports/arena.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.python }}
          path: reports/
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - name: Type check (also report when lint fails)
        if: always()
        run: mypy app

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax and pure data transformations
        run: |
          node --check app/ui/static/app.js
          node --check app/ui/static/model.js
          node --test frontend_tests/model.test.mjs
      - run: python -m pip install -e '.[dev]' playwright
      - run: python -m playwright install --with-deps chromium
      - name: Exercise the actual console against the real backend
        run: python -m pytest browser_tests -ra --strict-markers --junitxml=reports/browser.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulse-console-browser-evidence
          path: reports/
