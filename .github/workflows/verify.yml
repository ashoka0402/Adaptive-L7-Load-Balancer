name: Pulse verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -e '.[dev]' pytest-cov
      - run: python -m compileall -q app backends benchmarks
      - name: Run full suite (no retries or ignored failures)
        run: python -m pytest -ra --strict-markers --junitxml=reports/junit.xml --cov=app --cov-report=term-missing --cov-report=xml:reports/coverage.xml
      - name: Generate actual Arena smoke benchmark
        run: python -m benchmarks.run_arena --output reports/arena.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ matrix.python }}
          path: reports/
  static-analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - name: Type check (also report when lint fails)
        if: always()
        run: mypy app

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax and pure data transformations
        run: |
          node --check app/ui/static/app.js
          node --check app/ui/static/model.js
          node --check app/fastapi_lb/lab.js
          node --test frontend_tests/model.test.mjs
      - run: python -m pip install -e '.[dev]' playwright
      - run: python -m playwright install --with-deps chromium
      - name: Exercise the actual console against the real backend
        run: python -m pytest browser_tests -ra --strict-markers --junitxml=reports/browser.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulse-console-browser-evidence
          path: reports/

  release-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - name: Check out the original audited implementation
        run: git worktree add --detach "$RUNNER_TEMP/pulse-original" 027d578d790fa6b1784e7fee3969f7003ac8272d
      - name: Execute real original/current HTTP measurements
        run: python -m benchmarks.release_compare --baseline "$RUNNER_TEMP/pulse-original" --output reports/release-comparison.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulse-release-http-comparison
          path: reports/release-comparison.json
  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      GRAFANA_ADMIN_PASSWORD: ci-local-only-grafana-password
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configurations
        run: |
          docker compose config --quiet
          docker compose -f docker-compose.lab.yml config --quiet
      - name: Build and launch Pulse with its three demo backends
        run: docker compose up -d --build load-balancer
      - name: Check real proxy, console, and local control plane
        run: |
          curl --fail --retry 20 --retry-delay 2 --retry-all-errors http://127.0.0.1:8080/pulse/
          curl --fail --retry 20 --retry-delay 2 --retry-all-errors http://127.0.0.1:8080/api/test
          curl --fail http://127.0.0.1:8080/admin/console
          test "$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: external.example' http://127.0.0.1:8080/admin/console)" = 403
      - name: Run network-isolated Docker Arena
        run: |
          mkdir -p reports
          PULSE_UID=$(id -u) PULSE_GID=$(id -g) docker compose -f docker-compose.lab.yml run --rm arena
          python -c 'import json; d=json.load(open("reports/http-arena.json")); assert d["state"]=="completed"; assert len(d["runs"])==6; assert all(r["mode"]=="http" and r["summary"]["successful"]>0 for r in d["runs"])'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pulse-docker-http-arena
          path: reports/http-arena.json
      - name: Cleanup
        if: always()
        run: docker compose down -v
